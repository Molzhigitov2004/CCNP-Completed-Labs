lab:
  description: ''
  notes: |-
    =====================================================
    PBR LAB - ROUTING AROUND A FIREWALL (CCNP ENCOR)
    =====================================================

    TOPOLOGY (5 routers + 1 firewall):

    R1 --- G1 (R2)
    R2 --- G3 (FW) --- G3 (R3)
    R2 --- G2 (R3)          (direct link, bypasses FW)
    R3 --- G2 (R4)

    ---------------------------------------------------
    ADDRESSING TABLE
    ---------------------------------------------------
    Device   Interface     Network             IP
    R1       Lo0           10.1.0.0/24         .1
    R1       Lo1           10.1.1.0/24         .1
    R1       G1             192.168.12.0/24     .1
    R2       G1             192.168.12.0/24     .2
    R2       G2             192.168.23.0/24     .2
    R2       G3             172.16.22.0/24      .2
    FW       inside         172.16.22.0/24      .1
    FW       outside        172.16.33.0/24      .1
    R3       G3             172.16.33.0/24      .3
    R3       G1             192.168.23.0/24     .3
    R3       G2             192.168.34.0/24     .3
    R4       G1             192.168.34.0/24     .4
    R4       Lo0            10.4.4.0/24         .4

    Note: R2 and R3 have TWO paths between them:
      - via FW (172.16.22.0/24 <-> 172.16.33.0/24)
      - direct (192.168.23.0/24)
    PBR decides which one each source network uses.

    =====================================================
    STEP 1 - BASE CONFIG AND REACHABILITY
    =====================================================

    1a) Configure IP addresses on all interfaces per the
        addressing table above, including R1's Lo0/Lo1 and
        R4's Lo0.

    1b) Enable a single IGP (OSPF area 0) on every link,
        including loopbacks, so R1 and R4 have full
        reachability to each other before PBR is added.

    Verify:
    - show ip route on R1 shows both 10.4.4.0/24 reachable
    - show ip route on R4 shows both 10.1.0.0/24 and
      10.1.1.0/24 reachable
    - traceroute 10.4.4.1 source 10.1.0.1  (note the path)
    - traceroute 10.4.4.1 source 10.1.1.1  (note the path)

    =====================================================
    STEP 2 - PBR ON R2 (OUTBOUND SPLIT BY SOURCE)
    =====================================================

    Goal: force 10.1.0.0/24 through the firewall path, and
    force 10.1.1.0/24 through the direct path.

    2a) On R2, build two ACLs matching each source network:

        access-list 101 permit ip 10.1.0.0 0.0.0.255 any
        access-list 102 permit ip 10.1.1.0 0.0.0.255 any

    2b) Build a route-map that sets the next hop per ACL match:

        route-map PBR-SPLIT permit 10
         match ip address 101
         set ip next-hop 172.16.22.1

        route-map PBR-SPLIT permit 20
         match ip address 102
         set ip next-hop 192.168.23.3

        route-map PBR-SPLIT permit 30
        ! no match = fall through to normal routing

    2c) Apply the policy on the INGRESS interface (G1, facing
        R1):

        interface GigabitEthernet1
         ip policy route-map PBR-SPLIT

    Verify:
    - show route-map PBR-SPLIT
    - show ip policy
    - traceroute 10.4.4.1 source 10.1.0.1
      -> should now go R2 -> FW -> R3 -> R4
    - traceroute 10.4.4.1 source 10.1.1.1
      -> should now go R2 -> R3 -> R4 direct

    =====================================================
    STEP 3 - PBR ON R3 (RETURN TRAFFIC, KEEP SYMMETRIC)
    =====================================================

    Goal: make sure return traffic takes the SAME path back,
    matched by destination this time. If you skip this, the
    firewall (stateful) will drop the 10.1.0.0/24 flow's
    return packets because they come back on a path the FW
    never saw the outbound packet on.

    3a) On R3, build two ACLs matching each destination
        network:

        access-list 101 permit ip any 10.1.0.0 0.0.0.255
        access-list 102 permit ip any 10.1.1.0 0.0.0.255

    3b) Build the return route-map:

        route-map PBR-RETURN permit 10
         match ip address 101
         set ip next-hop 172.16.33.1

        route-map PBR-RETURN permit 20
         match ip address 102
         set ip next-hop 192.168.23.2

        route-map PBR-RETURN permit 30

    3c) Apply on the ingress interface (G2, facing R4):

        interface GigabitEthernet2
         ip policy route-map PBR-RETURN

    Test:
    - traceroute 10.1.0.1 source 10.4.4.1 from R4
      -> should return R3 -> FW -> R2
    - traceroute 10.1.1.1 source 10.4.4.1 from R4
      -> should return R3 -> R2 direct
    - End-to-end ping/traceroute from R1 to R4 for both
      sources should now show fully symmetric paths

    =====================================================
    STEP 4 - FAILURE CASE (OPTIONAL)
    =====================================================

    Shut down R2's G3 (link to FW). Traffic matching ACL 101
    will still try to policy-route to 172.16.22.1 and may
    black-hole instead of falling back to the IGP route,
    since "set ip next-hop" does not auto fail over.

    Fix by adding:

        set ip next-hop verify-availability

    or by switching to:

        set ip next-hop recursive

    Compare behavior before/after with the link down.

    =====================================================
    FINAL VERIFICATION CHECKLIST
    =====================================================
    [ ] R1 and R4 loopbacks fully reachable via IGP before PBR
    [ ] R2 PBR route-map applied on ingress interface (G1)
    [ ] R3 PBR route-map applied on ingress interface (G2)
    [ ] 10.1.0.0/24 traffic takes R2 -> FW -> R3 path
    [ ] 10.1.1.0/24 traffic takes R2 -> R3 direct path
    [ ] Return traffic on R3 mirrors the same path (symmetric)
    [ ] Firewall does not drop any flow due to asymmetric routing
    [ ] Failure-case behavior tested and understood (optional)

    =====================================================
    END OF LAB
    =====================================================
