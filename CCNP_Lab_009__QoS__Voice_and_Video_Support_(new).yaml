          interface Vlan100
           ip address 100.1.1.1 255.255.255.0
           ip ospf 1 area 0
          !
          interface Vlan101
           ip address 101.1.1.1 255.255.255.0
           ip ospf 1 area 0
          !
          router ospf 1
           router-id 1.1.1.1
          !
          ip forward-protocol nd
          !
          ip http server
          ip http secure-server
          !
          ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
