lab:
  description: ''
  notes: |-
    =====================================================
    VRF-lite LAB - CCNP ENCOR (CML)
    =====================================================

    TOPOLOGY (IOSv routers, 6 nodes):

    C1R1 --- G1 (SPR1)
    C1R2 --- G2 (SPR1)
    SPR1 --- G5 --- SPR2
    C2R1 --- G3 (SPR1)
    C2R2 --- G4 (SPR1)

    ---------------------------------------------------
    ADDRESSING TABLE
    ---------------------------------------------------
    Link                Network            SPR1   Remote
    SPR1 G1 - C1R1       192.168.1.0/30     .1     C1R1 .2
    SPR1 G2 - C1R2       192.168.2.0/30     .1     C1R2 .2
    SPR1 G3 - C2R1       192.168.1.0/30     .1     C2R1 .2   (reused, diff VRF)
    SPR1 G4 - C2R2       192.168.3.0/30     .1     C2R2 .2
    SPR1 G5 - SPR2       172.16.1.0/30      .1     SPR2 .2

    C1R1 LAN   10.1.1.0/24   .1 on C1R1
    C1R2 LAN   10.1.2.0/24   .1 on C1R2
    C2R1 LAN   10.2.1.0/24   .1 on C2R1
    C2R2 LAN   10.2.2.0/24   .1 on C2R2

    Note: 192.168.1.0/30 is intentionally reused on G1 and G3.
    This only works because they will sit in separate VRFs.

    =====================================================
    STEP 1 - BASE CONFIG, VRF CREATION, INTERFACE ASSIGNMENT
    =====================================================

    1a) Configure IP addresses on C1R1, C1R2, C2R1, C2R2 (WAN +
    LAN sides) and SPR2 (link to SPR1).

    1b) On SPR1, create two VRFs:
        - VRF_1 using the OLD method (IPv4 only)
        - VRF_2 using the NEW method (supports IPv4/IPv6)

    1c) Assign SPR1 interfaces to VRFs:
        - G1, G2 -> VRF_1
        - G3, G4 -> VRF_2
        - G5     -> leave in the global routing table

    1d) Configure IP addresses on SPR1's G1-G5 per the addressing
        table above. Remember: assigning an interface to a VRF
        removes any existing IP address, so addressing must be
        done AFTER VRF assignment.

    Verify:
    - VRF names, address-families, and assigned interfaces
    - IP addressing on all interfaces
    - Global, VRF_1, and VRF_2 routing tables each show only
      their own directly connected networks

    =====================================================
    STEP 2 - OSPF DYNAMIC ROUTING (ALL VRFs + BETWEEN SPRs)
    =====================================================

    2a) Enable OSPF inside VRF_1 on SPR1 (G1, G2) and on C1R1/C1R2,
        so that 10.1.1.0/24 and 10.1.2.0/24 are learned dynamically
        inside VRF_1.

    2b) Enable OSPF inside VRF_2 on SPR1 (G3, G4) and on C2R1/C2R2,
        so that 10.2.1.0/24 and 10.2.2.0/24 are learned dynamically
        inside VRF_2.

    2c) Enable OSPF between SPR1 and SPR2 over the G5 link
        (172.16.1.0/30), in the global routing table.

    Verify:
    - Each VRF has its own OSPF process correctly bound
      (router ospf <id> vrf <name>)
    - OSPF neighbors form as expected in VRF_1, VRF_2, and globally
    - Routing tables (global, VRF_1, VRF_2) show the expected
      OSPF-learned routes
    - Ping C1R1 <-> C1R2 succeeds (same VRF)
    - Ping C2R1 <-> C2R2 succeeds (same VRF)
    - Ping C1R1 -> C2R1 fails (different VRF, no leak yet)

    =====================================================
    STEP 3 - VRF ROUTE LEAKING
    =====================================================

    Goal: allow ONLY C1R2's LAN (10.1.2.0/24, in VRF_1) to
    communicate with C2R1's LAN (10.2.1.0/24, in VRF_2), while all
    other cross-VRF traffic remains blocked.

    3a) Configure the necessary return-path static routes on C1R2
        and C2R1 pointing back toward SPR1.

    3b) On SPR1, configure route leaking between VRF_1 and VRF_2
        for this specific prefix pair only, using a mechanism that
        lets next-hops be resolved via the global routing table.

    3c) Since the leaked next-hops physically sit inside a VRF (not
        the global table), you will also need to add the appropriate
        glue routes in the global table so SPR1 can resolve them.

    Test:
    - C1R2 -> C2R1 succeeds (the leaked path)
    - C1R1 -> C2R1 still fails (isolation preserved elsewhere)
    - C1R2 -> C2R2 still fails (isolation preserved elsewhere)

    =====================================================
    FINAL VERIFICATION CHECKLIST
    =====================================================
    [ ] Two VRFs exist on SPR1 with correct interfaces assigned
    [ ] Global, VRF_1, and VRF_2 routing tables are separate and correct
    [ ] OSPF processes correctly bound per VRF, plus global OSPF
        between SPR1 and SPR2
    [ ] Ping C1R1 <-> C1R2 succeeds (same VRF)
    [ ] Ping C2R1 <-> C2R2 succeeds (same VRF)
    [ ] Ping C1R1 -> C2R1 fails (different VRF, no leak)
    [ ] Ping C1R2 -> C2R1 succeeds (leaked route)
    [ ] Ping C1R2 -> C2R2 fails (isolation preserved)

    =====================================================
    END OF LAB
    =====================================================
  title: 030 Lab - VRF Lite
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
