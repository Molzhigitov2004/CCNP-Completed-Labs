           class type inspect TCP_CONN
            inspect
           class type inspect UDP_CONN
            inspect
           class type inspect ICMP_CONN
            inspect
           class class-default
            drop
          !
          zone security inside
           description zone that faces internal network
          zone security dmz
           description zone that faces dmz
          zone security outside
           description zone that faces public internet
          zone-pair security INSIDE_OUTSIDE source inside destination outside
           service-policy type inspect INSIDE_TO_OUTSIDE
          zone-pair security INSIDE_DMZ source inside destination dmz
           service-policy type inspect INSIDE_TO_DMZ
          zone-pair security OUTSIDE_DMZ source outside destination dmz
           service-policy type inspect OUTSIDE_TO_DMZ
          zone-pair security DMZ_OUTSIDE source dmz destination outside
           service-policy type inspect DMZ_TO_OUTSIDE
          zone-pair security OUTSIDE_SELF source outside destination self
           service-policy type inspect OUTSIDE_TO_SELF
          zone-pair security SELF_OUTSIDE source self destination outside
           service-policy type inspect SELF_TO_OUTSIDE
          !
          !
          !
          !
          !
          !
          !
          !
          !
          !
          !
          !
          !
          interface GigabitEthernet0/0
